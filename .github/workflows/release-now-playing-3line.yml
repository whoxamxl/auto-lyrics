name: Release Now Playing Subtitle-Description Test

on:
  push:
    branches:
      - feature/now-playing-3line
    paths:
      - .github/workflows/release-now-playing-3line.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/now-playing-3line
          fetch-depth: 0

      - name: Apply Now Playing test 2 source change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/autolyrics/auto/LyricsBrowserService.kt')
          s = path.read_text()

          # Remove test 1's previous/current/next multiline subtitle helper.
          s, count = re.subn(
              r'\n    private fun buildNowPlayingLyricsText\(.*?\n    \}\n\n    private fun getSubtitleText',
              '\n    private fun getSubtitleText',
              s,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'test1 3-line helper not found'

          # Keep only the current lyric in DISPLAY_SUBTITLE.
          pattern = re.compile(
              r'^        if \(state\.status == LyricsStatus\.FOUND\) \{\n'
              r'^\s+val lineIdx = findLineIndex\(state\.lines, posMs\)\n'
              r'^\s+if \(lineIdx >= 0\) \{\n'
              r'^\s+return buildNowPlayingLyricsText\(state, lineIdx, posMs\)\n'
              r'^\s+\}\n'
              r'^        \}\n',
              re.M,
          )
          replacement = '\n'.join([
              '        if (state.status == LyricsStatus.FOUND) {',
              '            val lineIdx = findLineIndex(state.lines, posMs)',
              '            val line = state.lines.getOrNull(lineIdx)',
              '            if (line != null) {',
              '                val current = if (aaKaraokeEnabled && line.words.isNotEmpty()) {',
              '                    buildKaraokeText(line, lineIdx, posMs, SUBTITLE_KARAOKE_WINDOW_MS)',
              '                } else {',
              '                    line.text.ifBlank { "♪" }',
              '                }',
              '                return "▶  $current"',
              '            }',
              '        }',
              '',
          ])
          s, count = pattern.subn(replacement, s, count=1)
          assert count == 1, 'test1 subtitle block not found'

          # Put the next lyric in DISPLAY_DESCRIPTION.
          marker = '    // --- MediaSession management ---\n'
          helper = '\n'.join([
              '    private fun getDescriptionText(state: LyricsState): String {',
              '        if (state.status != LyricsStatus.FOUND || state.lines.isEmpty()) return ""',
              '',
              '        val posMs = getAaPositionMs()',
              '        val lineIdx = findLineIndex(state.lines, posMs)',
              '        if (lineIdx < 0) {',
              '            return state.lines.firstOrNull()?.text?.ifBlank { "♪" } ?: ""',
              '        }',
              '',
              '        return state.lines.getOrNull(lineIdx + 1)?.text?.ifBlank { "♪" } ?: ""',
              '    }',
              '',
          ]) + marker
          assert marker in s, 'MediaSession marker not found'
          s = s.replace(marker, helper, 1)

          art_marker = '        val art = state.albumArt ?: lastAlbumArt\n'
          addition = '\n'.join([
              '        val descriptionText = getDescriptionText(state)',
              '        if (descriptionText.isNotBlank()) {',
              '            metaBuilder.putString(',
              '                MediaMetadataCompat.METADATA_KEY_DISPLAY_DESCRIPTION,',
              '                descriptionText',
              '            )',
              '        }',
              '',
          ]) + art_marker
          assert art_marker in s, 'album-art marker not found'
          s = s.replace(art_marker, addition, 1)

          path.write_text(s)
          PY

      - name: Commit test 2 source change
        id: source_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/autolyrics/auto/LyricsBrowserService.kt
          git commit -m "feat: show current lyric as subtitle and next lyric as description"
          git push origin HEAD:feature/now-playing-3line
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/auto-lyrics-1.9.6-now-playing-description-test2.apk
          sha256sum dist/auto-lyrics-1.9.6-now-playing-description-test2.apk > dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-1.9.6-now-playing-description-test2
          path: |
            dist/auto-lyrics-1.9.6-now-playing-description-test2.apk
            dist/SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.6-now-playing-description-test2
          target_commitish: ${{ steps.source_commit.outputs.sha }}
          name: Auto Lyrics 1.9.6 — Now Playing Description Test 2
          prerelease: true
          body: |
            Experimental Android Auto Now Playing build.

            Now Playing metadata mapping:
            - DISPLAY_TITLE = track title — artist (unchanged)
            - DISPLAY_SUBTITLE = ▶ current lyric
            - DISPLAY_DESCRIPTION = next lyric

            Browse-tree rendering is intentionally unchanged.

            Purpose: verify whether the Android Auto Now Playing host renders DISPLAY_DESCRIPTION as an additional small-text line/region without sacrificing the current lyric's subtitle space.
          files: |
            dist/auto-lyrics-1.9.6-now-playing-description-test2.apk
            dist/SHA256SUMS.txt
