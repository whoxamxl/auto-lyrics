name: Verify release minification

on:
  push:
    branches:
      - fix/resolve-past-codex-findings

permissions:
  contents: write

jobs:
  release-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-past-codex-findings
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build minified release APK
        run: gradle assembleRelease
      - name: Remove temporary verification workflow
        shell: bash
        run: |
          rm .github/workflows/verify-release-minification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary release verification workflow"
          git push origin HEAD:fix/resolve-past-codex-findings
