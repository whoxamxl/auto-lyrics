name: Build LRCLIB Search Test 2

on:
  push:
    branches:
      - feature/lrc-source-improvements

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lrc-source-improvements
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrclib-search-test2.apk
          sha256sum app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrclib-search-test2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-1.9.6-lrclib-search-test2
          path: app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrclib-search-test2.apk

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.9.6-lrclib-search-test2"
          SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$TAG" "$SHA"
          git push origin -f "$TAG"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrclib-search-test2.apk \
            --target "$SHA" \
            --title "Auto Lyrics 1.9.6 — LRCLIB Search Test 2" \
            --prerelease \
            --notes "Use LRCLIB directly as the single lyrics source. Re-rank LRCLIB candidates locally using normalized title, artist, album and duration; add structured and free-text fallback searches; preserve Live/Acoustic recording-version metadata; and invalidate older lyric cache entries."
