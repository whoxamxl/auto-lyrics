name: Apply past Codex fixes

on:
  push:
    branches:
      - fix/resolve-past-codex-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-past-codex-findings

      - name: Apply exact source patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "app/src/main/java/com/autolyrics/media/MediaTracker.kt",
              '''    private fun handleKaraokePreferenceChanged() {
                  val track = _state.value.track ?: return
                  fetchLyrics(track)
              }
          ''',
              '''    private fun handleKaraokePreferenceChanged() {
                  val track = _state.value.track ?: return
                  translationJob?.cancel()
                  LyricsTranslator.resetUiState()
                  _state.value = clearTranslationForLyricsVariantSwitch(_state.value)
                  fetchLyrics(track)
              }
          '''
          )

          replace_once(
              "app/src/main/java/com/autolyrics/lyrics/LrcLibClient.kt",
              '''        if (!versionsCompatible(trackName, candidateTitle, candidate.instrumental == true)) {
                      return null
                  }
          ''',
              '''        if (!versionsCompatible(
                      requestedTitle = trackName,
                      candidateTitle = candidateTitle,
                      candidateInstrumental = candidate.instrumental == true,
                      requestedAlbum = albumName,
                      candidateAlbum = candidateAlbum
                  )) {
                      return null
                  }
          '''
          )

          replace_once(
              "app/src/main/java/com/autolyrics/lyrics/LrcLibClient.kt",
              '''    internal fun versionsCompatible(
                  requestedTitle: String,
                  candidateTitle: String,
                  candidateInstrumental: Boolean = false
              ): Boolean {
                  val requested = extractVersionQualifiers(requestedTitle, instrumental = false)
                  val candidate = extractVersionQualifiers(candidateTitle, instrumental = candidateInstrumental)
                  return requested == candidate
              }
          ''',
              '''    internal fun versionsCompatible(
                  requestedTitle: String,
                  candidateTitle: String,
                  candidateInstrumental: Boolean = false,
                  requestedAlbum: String = "",
                  candidateAlbum: String = ""
              ): Boolean {
                  val requested = extractVersionQualifiers(requestedTitle, instrumental = false) +
                      extractVersionQualifiers(requestedAlbum, instrumental = false)
                  val candidate = extractVersionQualifiers(
                      candidateTitle,
                      instrumental = candidateInstrumental
                  ) + extractVersionQualifiers(candidateAlbum, instrumental = false)
                  return requested == candidate
              }
          '''
          )

          replace_once(
              "app/src/main/res/layout/activity_main.xml",
              '''            <Button
                          android:id="@+id/btn_aa_delay_plus"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:text="+50ms"
                          android:textSize="11sp"
                          android:textColor="#CCCCDD"
                          android:backgroundTint="#2A2A3E"
                          android:insetTop="0dp"
                          android:insetBottom="0dp"
                          android:textAllCaps="false"
                          android:minWidth="0dp"
                          android:paddingStart="10dp"
                          android:paddingEnd="10dp"
                          style="?attr/materialButtonOutlinedStyle" />
                  </LinearLayout>
          
                  <!-- AA Sync reset action -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="end"
                      android:layout_marginTop="4dp">
          
                      <Button
                          android:id="@+id/btn_aa_delay_reset"
                          android:layout_width="wrap_content"
                          android:layout_height="32dp"
                          android:text="⟳ Reset"
                          android:textSize="10sp"
                          android:textColor="#D7A0A8"
                          android:backgroundTint="#4A252C"
                          android:insetTop="0dp"
                          android:insetBottom="0dp"
                          android:textAllCaps="false"
                          android:minWidth="0dp"
                          android:paddingStart="12dp"
                          android:paddingEnd="12dp"
                          android:enabled="false"
                          android:alpha="0.35"
                          style="?attr/materialButtonOutlinedStyle" />
                  </LinearLayout>
          ''',
              '''            <Button
                          android:id="@+id/btn_aa_delay_plus"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:text="+50ms"
                          android:textSize="11sp"
                          android:textColor="#CCCCDD"
                          android:backgroundTint="#2A2A3E"
                          android:insetTop="0dp"
                          android:insetBottom="0dp"
                          android:textAllCaps="false"
                          android:minWidth="0dp"
                          android:paddingStart="10dp"
                          android:paddingEnd="10dp"
                          style="?attr/materialButtonOutlinedStyle" />
          
                      <Button
                          android:id="@+id/btn_aa_delay_reset"
                          android:layout_width="36dp"
                          android:layout_height="34dp"
                          android:layout_marginStart="6dp"
                          android:text="⟳"
                          android:textSize="14sp"
                          android:textColor="#D7A0A8"
                          android:backgroundTint="#4A252C"
                          android:contentDescription="Reset Android Auto lyric timing offset"
                          android:insetTop="0dp"
                          android:insetBottom="0dp"
                          android:textAllCaps="false"
                          android:minWidth="0dp"
                          android:padding="0dp"
                          android:enabled="false"
                          android:alpha="0.35"
                          style="?attr/materialButtonOutlinedStyle" />
                  </LinearLayout>
          '''
          )

          Path(".github/workflows/apply-past-codex-fixes.yml").unlink()
          PY

      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve remaining historical Codex findings"
          git push origin HEAD:fix/resolve-past-codex-findings
