name: Refine version context

on:
  push:
    branches:
      - fix/resolve-past-codex-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-past-codex-findings
      - name: Refine version matching
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/autolyrics/lyrics/LrcLibClient.kt")
          text = p.read_text()
          old = '''    ): Boolean {
                  val requested = extractVersionQualifiers(requestedTitle, instrumental = false) +
                      extractVersionQualifiers(requestedAlbum, instrumental = false)
                  val candidate = extractVersionQualifiers(
                      candidateTitle,
                      instrumental = candidateInstrumental
                  ) + extractVersionQualifiers(candidateAlbum, instrumental = false)
                  return requested == candidate
              }
          '''
          new = '''    ): Boolean {
                  val requestedTitleVersions = extractVersionQualifiers(
                      requestedTitle,
                      instrumental = false
                  )
                  val candidateTitleVersions = extractVersionQualifiers(
                      candidateTitle,
                      instrumental = candidateInstrumental
                  )
                  if (requestedTitleVersions == candidateTitleVersions) return true
          
                  val requestedContext = requestedTitleVersions +
                      extractVersionQualifiers(requestedAlbum, instrumental = false)
                  val candidateContext = candidateTitleVersions +
                      extractVersionQualifiers(candidateAlbum, instrumental = false)
                  return requestedContext.isNotEmpty() && requestedContext == candidateContext
              }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one versionsCompatible body, found {count}")
          p.write_text(text.replace(old, new, 1))
          Path(".github/workflows/refine-version-context.yml").unlink()
          PY
      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine LRCLIB version context matching"
          git push origin HEAD:fix/resolve-past-codex-findings
