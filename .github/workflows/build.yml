name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep provider identifiers out of ordinary PR/main artifacts. They are
      # injected only into version-tagged release builds.
      PETITLYRICS_USER_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PETITLYRICS_USER_ID || '' }}
      PETITLYRICS_APP_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PETITLYRICS_APP_NAME || '' }}
      PETITLYRICS_PKG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PETITLYRICS_PKG_NAME || '' }}
      PETITLYRICS_CLIENT_APP_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PETITLYRICS_CLIENT_APP_ID || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Validate PetitLyrics release configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          missing=()
          for name in \
            PETITLYRICS_USER_ID \
            PETITLYRICS_APP_NAME \
            PETITLYRICS_PKG_NAME \
            PETITLYRICS_CLIENT_APP_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required PetitLyrics release secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run lint
        shell: bash
        run: |
          set +e
          gradle lintDebug
          status=$?
          if (( status != 0 )); then
            report=app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
            if [[ -f "$report" ]]; then
              echo "----- lint-results-debug.txt -----"
              cat "$report"
              echo "----- end lint-results-debug.txt -----"
            fi
          fi
          exit "$status"

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          mkdir -p app/build/outputs/distribution
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SOURCE=app/build/outputs/apk/release/app-release.apk
          else
            SOURCE=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SOURCE" \
             "app/build/outputs/distribution/auto-lyrics-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-${{ steps.version.outputs.name }}
          path: app/build/outputs/distribution/auto-lyrics-${{ steps.version.outputs.name }}.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/distribution/auto-lyrics-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true

  windows-regression:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests with Windows wrapper
        shell: powershell
        run: .\gradlew.bat testDebugUnitTest

      - name: Assemble debug with Windows wrapper
        shell: powershell
        run: .\gradlew.bat assembleDebug

      - name: Lint debug with Windows wrapper
        shell: powershell
        run: .\gradlew.bat lintDebug
