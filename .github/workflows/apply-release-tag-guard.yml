name: Apply release tag guard

on:
  push:
    branches:
      - standalone-prep

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: standalone-prep
      - name: Add tag reuse guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          build = Path(".github/workflows/build.yml")
          text = build.read_text()
          start_marker = "      - name: Validate release version\n"
          end_marker = "      - name: Validate PetitLyrics release configuration\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          if "git ls-remote --exit-code --tags" in block:
              raise SystemExit("release tag reuse guard already present")
          outer_fi = "          fi\n"
          head, sep, tail = block.rpartition(outer_fi)
          if not sep or tail.strip():
              raise SystemExit("could not locate outer release-version fi")
          block = head + '''          elif git ls-remote --exit-code --tags origin "refs/tags/$EXPECTED_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $EXPECTED_TAG" >&2
            echo "Bump versionName/versionCode instead of replacing assets on an older tag." >&2
            exit 1
          fi

'''
          build.write_text(text[:start] + block + text[end:])

          release = Path("RELEASE.md")
          release_text = release.read_text()
          old = '''Do not create the tag manually when using this path.

### 4. Verify CI
'''
          new = '''Do not create the tag manually when using this path.

Before pushing, verify that `vX.Y.Z` is unused:

```powershell
git ls-remote --tags origin refs/tags/vX.Y.Z
```

This command should print nothing. Release CI performs the same remote-tag check and fails before building/publishing if the derived tag already exists.

### 4. Verify CI
'''
          if release_text.count(old) != 1:
              raise SystemExit("RELEASE.md: expected one atomic-release note")
          release_text = release_text.replace(old, new, 1)
          old_step = "2. validate release version/tag consistency,\n"
          if release_text.count(old_step) != 1:
              raise SystemExit("RELEASE.md: expected one release validation step")
          release_text = release_text.replace(
              old_step,
              "2. validate release version/tag consistency and reject tag reuse,\n",
              1
          )
          release.write_text(release_text)

          Path(".github/workflows/apply-release-tag-guard.yml").unlink()
          PY
      - name: Commit tag guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject reused release tags"
          git push origin HEAD:standalone-prep
