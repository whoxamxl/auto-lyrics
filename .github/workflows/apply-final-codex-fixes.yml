name: Apply final Codex fixes

on:
  push:
    branches:
      - fix/resolve-past-codex-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-past-codex-findings
      - name: Apply reviewed fixes
        run: python3 .github/scripts/apply_final_codex_fixes.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address final Codex regression findings"
          git push origin HEAD:fix/resolve-past-codex-findings
