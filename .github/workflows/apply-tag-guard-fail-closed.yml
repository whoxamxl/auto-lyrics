name: Harden release tag guard

on:
  push:
    branches:
      - standalone-prep

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: standalone-prep
      - name: Harden remote tag lookup
        run: python3 .github/scripts/harden_release_tag_guard.py
      - name: Commit hardened tag guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed on release tag lookup errors"
          git push origin HEAD:standalone-prep
