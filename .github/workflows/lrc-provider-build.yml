name: Build LRC Provider Test 1

on:
  push:
    branches:
      - feature/lrc-source-improvements

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lrc-source-improvements
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk
          sha256sum app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-1.9.6-lrc-provider-test1
          path: app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.9.6-lrc-provider-test1"
          SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$TAG" "$SHA"
          git push origin -f "$TAG"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk \
            --target "$SHA" \
            --title "Auto Lyrics 1.9.6 — LRC Provider Test 1" \
            --prerelease \
            --notes "Prefer synchronized lyrics across providers, stop requesting karaoke from SyncLRC, show the selected provider beside the sync status in Android Auto Browse, and invalidate old lyric cache entries for this test."
