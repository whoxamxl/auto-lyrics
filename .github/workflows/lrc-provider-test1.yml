name: LRC Provider Test 1

on:
  push:
    branches:
      - feature/lrc-source-improvements

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lrc-source-improvements
          fetch-depth: 0

      - name: Apply provider-selection changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Stop requesting karaoke from SyncLRC. Keep only synced -> plain.
          replace_once(
              "app/src/main/java/com/autolyrics/lyrics/SyncLrcClient.kt",
              '''    enum class LyricsType(val value: String) {\n        KARAOKE("karaoke"),\n        SYNCED("synced"),\n        PLAIN("plain")\n    }''',
              '''    enum class LyricsType(val value: String) {\n        SYNCED("synced"),\n        PLAIN("plain")\n    }'''
          )

          media_path = Path("app/src/main/java/com/autolyrics/media/MediaTracker.kt")
          media = media_path.read_text()

          # 2) Use a cross-provider resolver for current-track fetch and prefetch.
          current_call = "val result = fetchFromSyncLrc(track) ?: fetchFromLrcLib(track)"
          prefetch_call = "val result = fetchFromSyncLrc(nextTrack) ?: fetchFromLrcLib(nextTrack)"
          if media.count(current_call) != 1:
              raise SystemExit(f"Expected 1 current-track provider-chain call, found {media.count(current_call)}")
          if media.count(prefetch_call) != 1:
              raise SystemExit(f"Expected 1 prefetch provider-chain call, found {media.count(prefetch_call)}")
          media = media.replace(current_call, "val result = fetchBestLyrics(track)", 1)
          media = media.replace(prefetch_call, "val result = fetchBestLyrics(nextTrack)", 1)

          marker = '''    private fun fetchFromSyncLrc(track: TrackInfo): FetchResult? {'''
          if marker not in media:
              raise SystemExit("fetchFromSyncLrc marker not found")

          resolver = '''    private fun fetchBestLyrics(track: TrackInfo): FetchResult? {\n        // Prefer synchronized lyrics across providers. A plain SyncLRC hit must\n        // not prevent us from checking whether LRCLIB has a synchronized LRC.\n        val syncResult = fetchFromSyncLrc(track)\n        if (syncResult?.status == LyricsStatus.FOUND) return syncResult\n\n        val lrcLibResult = fetchFromLrcLib(track)\n        if (lrcLibResult?.status == LyricsStatus.FOUND) return lrcLibResult\n\n        // Neither provider has synchronized lyrics. Keep the existing provider\n        // preference for plain lyrics: SyncLRC first, then LRCLIB.\n        return syncResult ?: lrcLibResult\n    }\n\n'''
          media = media.replace(marker, resolver + marker, 1)

          karaoke_block = re.compile(
              r'''\s*SyncLrcClient\.LyricsType\.KARAOKE -> \{\n'''
              r'''\s*val lines = LrcParser\.parseKaraoke\(result\.lyrics\)\n'''
              r'''\s*val hasRealText = lines\.any \{ it\.text != "♪" && it\.text\.isNotBlank\(\) \}\n'''
              r'''\s*if \(hasRealText\) FetchResult\(lines, LyricsStatus\.FOUND, "SyncLRC · Karaoke"\)\n'''
              r'''\s*else null\n'''
              r'''\s*\}\n'''
          )
          media, count = karaoke_block.subn("\n", media, count=1)
          if count != 1:
              raise SystemExit(f"Expected to remove one Karaoke branch, removed {count}")
          media_path.write_text(media)

          # 3) Show the selected provider next to Synced/Not synced in AA Browse.
          browser_path = Path("app/src/main/java/com/autolyrics/auto/LyricsBrowserService.kt")
          browser = browser_path.read_text()
          label_pattern = re.compile(
              r'''    private fun lyricsTypeLabel\(state: LyricsState\): String \{.*?\n    \}\n\n    // --- Karaoke helpers ---''',
              re.S,
          )
          new_label = '''    private fun lyricsTypeLabel(state: LyricsState): String {\n        val provider = when {\n            state.source.startsWith("SyncLRC", ignoreCase = true) -> "SyncLRC"\n            state.source.startsWith("LRCLIB", ignoreCase = true) -> "LRCLIB"\n            else -> ""\n        }\n        val providerSuffix = if (provider.isNotBlank()) " · $provider" else ""\n        val lang = state.detectedLanguage?.uppercase()\n        val langSuffix = if (lang != null) " · $lang" else ""\n\n        return when (state.status) {\n            LyricsStatus.FOUND -> "⟳ Synced$providerSuffix$langSuffix"\n            LyricsStatus.PLAIN_ONLY -> "⟳ Not synced$providerSuffix$langSuffix"\n            else -> "⟳ Sync"\n        }\n    }\n\n    // --- Karaoke helpers ---'''
          browser, count = label_pattern.subn(new_label, browser, count=1)
          if count != 1:
              raise SystemExit(f"Expected to replace one lyricsTypeLabel, replaced {count}")
          browser_path.write_text(browser)

          # 4) Invalidate old cached provider decisions so Test 1 immediately
          #    exercises the new resolver on devices that already used Auto Lyrics.
          replace_once(
              "app/src/main/java/com/autolyrics/lyrics/LyricsCache.kt",
              '''        val key = "${title.lowercase().trim()}|${artist.lowercase().trim()}"''',
              '''        val key = "v2|${title.lowercase().trim()}|${artist.lowercase().trim()}"'''
          )
          PY

      - name: Commit patched source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/autolyrics/lyrics/SyncLrcClient.kt \
                  app/src/main/java/com/autolyrics/lyrics/LyricsCache.kt \
                  app/src/main/java/com/autolyrics/media/MediaTracker.kt \
                  app/src/main/java/com/autolyrics/auto/LyricsBrowserService.kt
          git commit -m "Prefer synced lyrics across providers"
          git push origin HEAD:feature/lrc-source-improvements
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-1.9.6-lrc-provider-test1
          path: app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.9.6-lrc-provider-test1"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$TAG" "${{ steps.commit.outputs.sha }}"
          git push origin -f "$TAG"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/auto-lyrics-1.9.6-lrc-provider-test1.apk \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "Auto Lyrics 1.9.6 — LRC Provider Test 1" \
            --prerelease \
            --notes "Prefer synchronized lyrics across SyncLRC and LRCLIB, stop requesting karaoke, show the selected provider beside the sync status in Android Auto Browse, and invalidate old lyric cache entries for this test."
