name: Apply album version context

on:
  push:
    branches:
      - fix/resolve-past-codex-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-past-codex-findings
      - name: Patch LRCLIB album evidence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/autolyrics/lyrics/LrcLibClient.kt")
          text = p.read_text()
          old_requested = "extractVersionQualifiers(requestedAlbum, instrumental = false)"
          old_candidate = "extractVersionQualifiers(candidateAlbum, instrumental = false)"
          if text.count(old_requested) != 1 or text.count(old_candidate) != 1:
              raise SystemExit("unexpected LRCLIB album qualifier call count")
          text = text.replace(old_requested, "extractAlbumVersionQualifiers(requestedAlbum)", 1)
          text = text.replace(old_candidate, "extractAlbumVersionQualifiers(candidateAlbum)", 1)
          p.write_text(text)
          Path(".github/workflows/apply-album-version-context.yml").unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use explicit album version context"
          git push origin HEAD:fix/resolve-past-codex-findings
